name: running_monster
description: ランニングモンスター - GPSランニングアプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.1

  # GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Map (OpenStreetMap, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Screen lock during run
  wakelock_plus: ^1.2.8

  # QR code generation
  qr_flutter: ^4.1.0

  # QR code scanning
  mobile_scanner: ^4.0.1

  # Local notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Rewarded ads (AdMob)
  google_mobile_ads: ^9.0.0

  # Image share & save
  share_plus: ^10.1.4
  gal: ^2.3.0
  path_provider: ^2.1.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/icons/splash_logo.png
  color_dark: "#1A1A2E"
  image_dark: assets/icons/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#1A1A2E"
    image: assets/icons/splash_logo.png
    icon_background_color: "#1A1A2E"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
